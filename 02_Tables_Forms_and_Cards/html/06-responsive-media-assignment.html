<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            margin: 0;
            padding: 0;
        }
        nav{
            height: 70px;
            background-color: black;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            
            
        }
        a{

        @media screen and (max-width:500px) {
            nav{
                display: block;
                padding: 60px;
                height: fit-content;
            }
            a{
                display: block;
                margin-top: 15px;
            }
        }
    </style>
</head>
<body>
    <nav>

        <a href="">Hone</a>
