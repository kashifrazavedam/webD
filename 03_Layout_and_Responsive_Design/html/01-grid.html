<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #main{
            height: 90vh;
            border: 2px solid;
            display: grid;
            grid-template-columns: 200px 200px 200px 200px 200px 200px 200px;
            grid-template-rows: 200px 200px;
        }
        .one{
            height: 100%;
            width: 100%;
            border: 2px solid red;
        }
        #one1{
            background-color: red;
        }
        #one2{
            background-color: rgb(16, 110, 38);
        }
        #one3{
            background-color: rgb(6, 1, 1);
            grid-column: 3/5;
        }
        #one4{
            background-color: rgb(56, 21, 170);
        }
        #one5{
            background-color: rgb(203, 229, 35);
        }
        #one6{
            background-color: rgb(225, 172, 13);
            grid-column: 3/1;
            grid-row: 4/5;
        }
        #one7{
            background-color: rgb(252, 89, 222);
        }
    </style>
</head>
<body>
    <div id="main">
        <div id="one1" class="one"></div>
        <div id="one2" class="one"></div>
        <div id="one3" class="one"></div>
        <div id="one4" class="one"></div>
        <div id="one5" class="one"></div>
        <div id="one6" class="one"></div>
        <div id="one7" class="one"></div>
        <div id="one8" class="one"></div>
        <div id="one9" class="one"></div>
        <div id="one99" class="one"></div>
        <div id="one999" class="one"></div>
    </div>
</body>
</html>
