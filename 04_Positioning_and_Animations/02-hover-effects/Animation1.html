<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            height: 200px;
            width: 300px;
            background-color: red;
           
        }
        div:hover {
            animation-name: anime;
            animation-duration: 3s;
        }
        @keyframes anime{
            0%{
                background-color: red;
                border-radius: 0%;
            }
            50%{
                background-color: aqua;
                border-radius: 30%;
                height: 100vh;
                width: 100vw;
            }
            70%{
                background-color: rgb(12, 94, 39);
                border-radius: 50%;
                /* height: 100vh; */
                width: 100vw;
            }
            80%{
                background-color: rgb(64, 77, 228);
                border-radius: 50%;
                height: 100vh;
                width: 100vw;
            }
            90%{
                background-color: rgb(0, 1, 10);
                border-radius: 50%;
                height: 10vh;
                width: 10vw;
            }

        }
    </style>
</head>
<body>
    <div></div>
</body>
</html>
