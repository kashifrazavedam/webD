<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            perspective: 900px;
            margin: 0px auto;
        }
        #main{
            height: 100vh;
            width: 100vw;
            border: 0px solid;
            display: flex;
            justify-content: center;
            align-items: center;
            /* animation: alternate; */
            background-color: black;
            

        }

        #main div{
            margin-left: 70px;
        }
        #ball1{
            height: 100px;
            width: 100px;
            background-image: linear-gradient(orange,rgb(246, 226, 155));
            border-radius: 50%;
            animation-name: anime;
            animation-duration: 1s;
            animation-iteration-count: infinite;
            animation-delay: 0.2s;
        }
        #ball2{
            height: 100px;
            width: 10px;
            border-radius: 50%;
            background-image: linear-gradient(blue,rgb(162, 188, 239));
            animation-name: anime;
            animation-duration: 0.2s;
            animation-iteration-count: infinite;
            animation-delay: 0.0002s;

        }
        #ball3{
            height: 100px;
            width: 100px;
            border-radius: 50%;
            animation-name: anime;
            background-image: linear-gradient(pink,rgb(204, 172, 213));
            animation-iteration-count: infinite;
            animation-duration: 1s;
            animation-delay: 0.4s;
            

        }
        @keyframes anime{
            0%{
                transform: translateY(0) scale(1);
               opacity: 0.5;

                
            }
            50%{
                transform: translateY(-50px) scale(1.3);
                opacity: 1;
            }
            100%{
                transform: translateY(0) scale(1);
                

                
            }
        }
        
    </style>
</head>
<body>
    <div id="main">
        <div id="ball1"></div>
        <div id="ball2"></div>
        <div id="ball3"></div>
    </div>
</body>
</html>
